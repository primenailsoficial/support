<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050506">
<title>Prime Nails | Suporte</title>
<style>

:root{box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#050506;--card:#131317;--tx:#f5f5f7;--mut:#a3a3ae;--bd:#2c2c34;--s1:#fff;--s2:#d6d6dc;--s3:#8d8d97;--ok:#7fe3ae}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,.opt,.btn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none;outline:none;touch-action:manipulation}
button *,a *{pointer-events:none}
:focus-visible{box-shadow:0 0 0 3px rgba(255,255,255,.45)}
body{margin:0;min-height:100vh;color:var(--tx);font-family:Georgia,"Times New Roman",serif;line-height:1.5;background:radial-gradient(120% 60% at 50% -10%,#24242b 0%,transparent 60%),radial-gradient(90% 50% at 100% 100%,#17171c,transparent 60%),var(--bg);background-attachment:fixed}
svg{display:block}
.wrap{position:relative;max-width:480px;margin:0 auto;padding:16px 16px 56px}
.bn{text-align:center;margin:4px 0 10px}
.bn b{font-size:18px;letter-spacing:3px;background:linear-gradient(90deg,var(--s3),#fff,var(--s3));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 5s linear infinite}
@keyframes flow{to{background-position:-200% 0}}
.grad{background:linear-gradient(90deg,var(--s3),#fff,var(--s3));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 6s linear infinite}
h1{font-size:27px;line-height:1.2;margin:10px 0;font-weight:700}
h2{font-size:22px;line-height:1.25;margin:10px 0 16px}
p{margin:0 0 14px;color:var(--mut);font:15px/1.55 system-ui,sans-serif}
#app>*:not(.opt){animation:up .28s ease backwards}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{position:relative;background:linear-gradient(160deg,#18181d,#0f0f13);border:1px solid var(--bd);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.card::before{content:"";position:absolute;left:22px;right:22px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent)}
.hd{display:flex;align-items:center;gap:11px;font:700 16px system-ui,sans-serif}
.hd .ch{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--s2);background:linear-gradient(145deg,#2e2e36,#17171c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.btn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:50px;padding:18px 20px;font:800 16px/1.2 system-ui,sans-serif;letter-spacing:.4px;color:#0a0a0c;background:linear-gradient(145deg,#fff 0%,#d3d3da 45%,#9b9ba5 100%);cursor:pointer;text-decoration:none;box-shadow:0 10px 26px rgba(255,255,255,.14),inset 0 1px 0 #fff,inset 0 -3px 0 rgba(0,0,0,.18);margin:12px 0 14px;transition:transform .12s,box-shadow .12s}
.btn::after,.opt::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:36%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.7),transparent);transform:skewX(-20deg);animation:shine 3.8s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,55%{left:-60%}100%{left:140%}}
.btn:active{transform:scale(.97)}
.pulse{animation:pl 2.6s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.02);box-shadow:0 14px 32px rgba(255,255,255,.26),inset 0 1px 0 #fff,inset 0 -3px 0 rgba(0,0,0,.18)}}
.opt{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;text-align:left;color:var(--tx);background:linear-gradient(145deg,#1e1e24,#0f0f13);border:1.5px solid #373740;border-radius:18px;padding:12px 14px;margin-bottom:10px;font:600 16px/1.3 system-ui,sans-serif;cursor:pointer;box-shadow:0 8px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);animation:up .3s ease backwards;animation-delay:calc(var(--i)*40ms)}
.opt::after{opacity:.45;animation-delay:calc(var(--i)*.4s)}
.opt .ico{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--s1);background:linear-gradient(145deg,#33333c,#17171c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.opt .tx{flex:1}
.opt .rd{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid #4a4a54;display:grid;place-items:center;color:#fff}
.opt .rd svg{opacity:0;transform:scale(.4);transition:all .15s}
@media (hover:hover){.opt:hover{border-color:#8d8d97}}
.opt:active{transform:scale(.985);border-color:#aaa}
.opt.sel{color:#0a0a0c;border-color:transparent;background:linear-gradient(145deg,#fff,#d3d3da 50%,#9b9ba5);box-shadow:0 0 0 3px rgba(255,255,255,.3),0 12px 28px rgba(255,255,255,.22);animation:pop .16s ease}
@keyframes pop{50%{transform:scale(1.035)}}
.opt.sel .ico{color:#0a0a0c;background:rgba(0,0,0,.1);box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.opt.sel .rd{background:#0a0a0c;border-color:#0a0a0c}.opt.sel .rd svg{opacity:1;transform:none}
.opt.off{opacity:.45}
.pb{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.bar{flex:1;height:12px;background:#23232a;border-radius:12px;position:relative;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.bar i{position:relative;display:block;height:100%;width:0;border-radius:12px;background:linear-gradient(90deg,#6f6f79,#fff,#b9b9c2,#fff);background-size:200% 100%;animation:flow 2.4s linear infinite;transition:width .35s ease;box-shadow:0 0 14px rgba(255,255,255,.55)}
.bar i::after{content:"";position:absolute;right:-5px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:#fff;box-shadow:0 0 14px rgba(255,255,255,.9)}
.pct{font:800 13px system-ui,sans-serif;color:var(--s2);min-width:40px;text-align:right}
.qn{font:600 13px system-ui,sans-serif;color:var(--mut);margin:0 0 4px}
.tag{display:inline-flex;align-items:center;gap:7px;color:var(--s2);background:linear-gradient(145deg,#24242b,#15151a);border:1px solid #3a3a43;font:800 12px system-ui,sans-serif;padding:7px 14px;border-radius:20px;letter-spacing:.7px}
.big{font:800 50px Georgia,serif;line-height:1;background:linear-gradient(145deg,#fff,#9b9ba5);-webkit-background-clip:text;background-clip:text;color:transparent}
.chk{padding:0;margin:0;font:15px/1.5 system-ui,sans-serif}.chk li{list-style:none;margin:0 0 12px;padding-left:34px;position:relative}
.chk li::before{content:"✓";position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;background:linear-gradient(145deg,#fff,#9b9ba5);color:#0a0a0c;font-size:13px;font-weight:800;display:grid;place-items:center}
.mut{font-size:13px;text-align:center}
.safe{display:flex;align-items:center;justify-content:center;gap:7px;font:13px system-ui,sans-serif;color:var(--mut)}
.meter{height:14px;border-radius:10px;background:#23232a;overflow:hidden}.meter i{display:block;height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,#6f6f79,#fff,#b9b9c2,#fff);background-size:200% 100%;animation:flow 2.4s linear infinite;transition:width 1.6s cubic-bezier(.3,.9,.3,1);box-shadow:0 0 14px rgba(255,255,255,.5)}
.score{font:800 38px Georgia,serif;text-align:right;margin-top:6px;background:linear-gradient(145deg,#fff,#9b9ba5);-webkit-background-clip:text;background-clip:text;color:transparent}
.old{text-decoration:line-through;color:var(--mut);font-family:system-ui,sans-serif}
.l3{perspective:800px;width:170px;height:170px;margin:2px auto 12px;position:relative;filter:drop-shadow(0 14px 24px rgba(255,255,255,.2))}
.l3 img{width:100%;height:100%;display:block;animation:spin3d 7s ease-in-out infinite;-webkit-mask:radial-gradient(circle closest-side,#000 0 69.5%,transparent 71%);mask:radial-gradient(circle closest-side,#000 0 69.5%,transparent 71%)}
.l3.sm{width:110px;height:110px;margin-bottom:8px}
@keyframes spin3d{0%,100%{transform:rotateY(-28deg) rotateX(6deg) translateY(0)}50%{transform:rotateY(28deg) rotateX(-4deg) translateY(-8px)}}
.strip{display:flex;justify-content:center;gap:12px;margin:6px 0 16px}
.si{display:flex;flex-direction:column;align-items:center;gap:6px;font:700 11px system-ui,sans-serif;color:var(--mut);letter-spacing:.4px}
.si span{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;color:var(--s1);background:linear-gradient(145deg,#2a2a32,#141418);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14),0 6px 14px rgba(0,0,0,.5);animation:fl 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*.3s)}
@keyframes fl{50%{transform:translateY(-4px)}}
.steps{list-style:none;padding:0;margin:14px 0 0;font:14px system-ui,sans-serif;text-align:left}
.steps li{display:flex;align-items:center;gap:10px;color:#6c6c76;margin-bottom:9px;transition:color .3s}
.steps li .st{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #3a3a43;display:grid;place-items:center;color:#0a0a0c;transition:all .3s}
.steps li.run{color:var(--tx)}.steps li.run .st{border-color:#fff;border-top-color:transparent;animation:rot .7s linear infinite}
.steps li.ok{color:var(--s2)}.steps li.ok .st{background:#fff;border-color:#fff}
.steps li .st svg{opacity:0}.steps li.ok .st svg{opacity:1}
@keyframes rot{to{transform:rotate(360deg)}}
.sub{font:600 14px/1.5 system-ui,sans-serif;color:var(--mut);margin:8px 0 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== PREMIUM FX ===== */
.wrap{z-index:1}
body::before,body::after{content:"";position:fixed;z-index:0;pointer-events:none;width:70vmax;height:70vmax;border-radius:50%;filter:blur(60px);opacity:.55}
body::before{left:-35vmax;top:-30vmax;background:radial-gradient(circle,rgba(255,255,255,.10),transparent 65%);animation:drift 16s ease-in-out infinite alternate}
body::after{right:-40vmax;bottom:-35vmax;background:radial-gradient(circle,rgba(190,190,210,.11),transparent 65%);animation:drift 20s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(12vmax,8vmax) scale(1.15)}}
.l3::after{content:"";position:absolute;inset:-6%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.24),transparent 62%);animation:breathe 3.4s ease-in-out infinite;z-index:-1}
@keyframes breathe{50%{transform:scale(1.12);opacity:.55}}
.l3.xs{width:78px;height:78px;margin:2px auto 8px}
.bn b{filter:drop-shadow(0 0 8px rgba(255,255,255,.35))}
@keyframes pl{0%,100%{transform:scale(1);box-shadow:0 10px 26px rgba(255,255,255,.14),0 0 0 0 rgba(255,255,255,.45),inset 0 1px 0 #fff,inset 0 -3px 0 rgba(0,0,0,.18)}50%{transform:scale(1.025);box-shadow:0 16px 38px rgba(255,255,255,.32),0 0 0 12px rgba(255,255,255,0),inset 0 1px 0 #fff,inset 0 -3px 0 rgba(0,0,0,.18)}}
.btn svg:last-child{animation:nudge 1.3s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(5px)}}
.opt{transition:transform .15s,border-color .2s,box-shadow .2s}
.opt:not(.sel):active{transform:scale(.98);border-color:#8d8d97}
@media(hover:hover){.opt:not(.sel):hover{border-color:#8d8d97;box-shadow:0 8px 22px rgba(255,255,255,.08),inset 0 1px 0 rgba(255,255,255,.1)}}
.opt.sel::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 50%,rgba(255,255,255,.9),transparent 60%);opacity:0;animation:flash .55s ease-out}
@keyframes flash{0%{opacity:.8}100%{opacity:0}}
.card::before{background-size:200% 100%;animation:flow 5s linear infinite}
.tag{animation:tg 2.8s ease-in-out infinite}@keyframes tg{50%{box-shadow:0 0 18px 2px rgba(255,255,255,.22)}}
.big,.score{filter:drop-shadow(0 0 14px rgba(255,255,255,.35))}
.card:has(.steps){overflow:hidden;border-color:#4a4a55;animation:cg 2.4s ease-in-out infinite}
@keyframes cg{50%{box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 34px rgba(255,255,255,.14)}}
.card:has(.steps)::after{content:"";position:absolute;left:0;right:0;height:60px;top:-60px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.10),transparent);animation:scan 2.6s linear infinite;pointer-events:none}
@keyframes scan{to{top:100%}}
.card.done{animation:dn .8s ease-out}@keyframes dn{40%{box-shadow:0 0 60px rgba(255,255,255,.55);transform:scale(1.02)}}
.ft{margin:20px 0 4px;text-align:center}
.dv{position:relative;height:1px;margin:0 auto 16px;max-width:260px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);background-size:200% 100%;animation:flow 4s linear infinite}
.dv::after{content:"";position:absolute;left:50%;top:-3px;width:7px;height:7px;margin-left:-3px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff}
.cp{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.cp span{display:inline-flex;align-items:center;gap:6px;font:700 11.5px system-ui,sans-serif;color:var(--s2);padding:7px 11px;border-radius:20px;border:1px solid #33333b;background:linear-gradient(145deg,#1d1d23,#111115);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.dt{display:flex;justify-content:center;gap:7px}
.dt i{width:7px;height:7px;border-radius:50%;background:#2f2f37}
.dt i.on{background:#fff;box-shadow:0 0 10px rgba(255,255,255,.8)}
.dt.w i{animation:wv 1.6s ease-in-out infinite;animation-delay:calc(var(--k)*.12s)}
@keyframes wv{50%{background:#fff;transform:translateY(-3px);box-shadow:0 0 10px rgba(255,255,255,.8)}}
#stk{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 10px);background:linear-gradient(180deg,transparent,rgba(5,5,6,.92) 40%);transform:translateY(120%);transition:transform .35s ease;pointer-events:none}
#stk.on{transform:none;pointer-events:auto}
#stk .btn{max-width:448px;margin:0 auto}
/* ===== LOGO 360 ===== */
.l3r{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;animation:spin360 7s linear infinite}
.l3 img{animation:none;position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.l3 img.f{transform:translateZ(2px)}
.l3 img.b{transform:rotateY(180deg) translateZ(2px)}
.l3 .rg{position:absolute;inset:11%;border-radius:50%;background:conic-gradient(from 0deg,rgba(255,255,255,0),#fff 18%,rgba(255,255,255,0) 40%,rgba(160,160,175,.85) 62%,rgba(255,255,255,0) 80%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:rot 4s linear infinite;filter:drop-shadow(0 0 6px rgba(255,255,255,.8))}
.l3 .eg{position:absolute;inset:15.5%;border-radius:50%;background:linear-gradient(145deg,#e8e8ee,#6f6f79);transform:translateZ(var(--z))}
@keyframes spin360{0%,10%{transform:rotateX(8deg) rotateY(0) translateY(0);animation-timing-function:ease-in-out}45%,60%{transform:rotateX(8deg) rotateY(180deg) translateY(-8px);animation-timing-function:ease-in-out}95%,100%{transform:rotateX(8deg) rotateY(360deg) translateY(0)}}
/* ===== BLOCOS DA OFERTA ===== */
.st4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 6px}
.st4 div{text-align:center;padding:12px 4px;border-radius:16px;border:1px solid #33333b;background:linear-gradient(145deg,#1d1d23,#111115);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.st4 b{display:block;font:800 26px Georgia,serif;background:linear-gradient(145deg,#fff,#9b9ba5);-webkit-background-clip:text;background-clip:text;color:transparent}
.st4 span{font:700 9.5px system-ui,sans-serif;color:var(--mut);letter-spacing:.4px}
details{border:1px solid #33333b;border-radius:16px;background:linear-gradient(145deg,#1b1b21,#101014);margin-bottom:10px;overflow:hidden;transition:border-color .2s}
details[open]{border-color:#6a6a76}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px;font:700 15px/1.3 system-ui,sans-serif;color:var(--tx)}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-size:22px;color:var(--s2);transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
summary .nb{flex:none;width:32px;height:32px;border-radius:11px;display:grid;place-items:center;font:800 13px system-ui,sans-serif;color:#0a0a0c;background:linear-gradient(145deg,#fff,#9b9ba5)}
.dm{margin:0;padding:0 16px 14px 48px;font:14px/1.5 system-ui,sans-serif;color:var(--mut)}.dm li{margin-bottom:6px}
.bg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.bg div{display:flex;align-items:center;gap:9px;padding:11px;border-radius:14px;border:1px solid #33333b;background:linear-gradient(145deg,#1d1d23,#111115);font:600 12.5px/1.3 system-ui,sans-serif;color:var(--tx)}
.bg i{flex:none;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font:800 11px system-ui,sans-serif;font-style:normal;color:#0a0a0c;background:linear-gradient(145deg,#fff,#9b9ba5)}
.pr{border-color:#7a7a86;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 18px 44px rgba(255,255,255,.12)}
.trust{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 14px;font:12px system-ui,sans-serif;color:var(--mut);margin-bottom:6px}
.trust span{display:inline-flex;align-items:center;gap:6px}
.save{display:inline-block;margin-top:8px;font:800 12px system-ui,sans-serif;letter-spacing:.5px;color:#0a0a0c;background:linear-gradient(145deg,#fff,#9b9ba5);padding:5px 12px;border-radius:20px}
/* ===== CERTIFICADO 3D ===== */
.c3{perspective:900px;width:min(300px,100%);height:226px;margin:14px auto 26px;position:relative}
.c3::after{content:"";position:absolute;left:8%;right:8%;bottom:-16px;height:18px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.4),transparent 70%);filter:blur(6px);animation:breathe 3.4s ease-in-out infinite}
.cr{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;animation:spin360 9s linear infinite;filter:drop-shadow(0 12px 22px rgba(255,255,255,.14))}
.ce{position:absolute;inset:0;border-radius:14px;background:#8d8d97;transform:translateZ(var(--z))}
.cf,.cb{position:absolute;inset:0;border-radius:14px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:14px 20px;background:linear-gradient(150deg,#1c1c22,#09090b 55%,#17171c);border:1.5px solid #b9b9c2;box-shadow:inset 0 0 0 5px #0b0b0e,inset 0 0 0 6px #5a5a66}
.cf{transform:translateZ(3px)}.cb{transform:rotateY(180deg) translateZ(3px)}
.cf::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.2) 50%,transparent 65%);background-size:250% 100%;animation:flow 3.2s linear infinite;pointer-events:none}
.lg{display:block;border-radius:50%;background:var(--lg) center/146% no-repeat;box-shadow:0 0 0 1.5px #3a3a42}
.cw{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cn{font:800 11px Georgia,serif;letter-spacing:3px;color:#d6d6dc}
.ct{font:700 21px Georgia,serif;letter-spacing:4px;background:linear-gradient(90deg,#8d8d97,#fff,#8d8d97);-webkit-background-clip:text;background-clip:text;color:transparent}
.cs{font:700 8px system-ui,sans-serif;letter-spacing:2.4px;color:var(--mut)}
.cx{font:9px/1.4 system-ui,sans-serif;color:var(--mut);margin-top:7px}
.cm{font:italic 15px Georgia,serif;color:#fff;border-bottom:1px solid #6a6a76;padding:2px 14px 3px;margin-top:3px}
.cc{font:700 10.5px/1.3 system-ui,sans-serif;color:var(--tx);margin-top:3px}
.cg{display:flex;gap:6px;width:100%;margin-top:11px}.cg span{flex:1;border-top:1px solid #5a5a66;padding-top:3px;font:7.5px/1.2 system-ui,sans-serif;color:var(--mut)}

/* ===== SUPORTE ===== */
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);animation:on 1.8s infinite}
@keyframes on{0%{box-shadow:0 0 0 0 rgba(127,227,174,.6)}70%,100%{box-shadow:0 0 0 8px rgba(127,227,174,0)}}
.bub{display:flex;gap:12px;align-items:flex-start}
.av2{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#0a0a0c;background:linear-gradient(145deg,#fff,#9b9ba5);box-shadow:0 0 18px rgba(255,255,255,.25)}
.bub small{display:block;font:800 11px system-ui,sans-serif;letter-spacing:.6px;color:var(--s2);margin-bottom:3px}
.bub p{margin:0;color:var(--tx)}
.typing{display:inline-flex;gap:5px;padding:7px 0}
.typing i{width:8px;height:8px;border-radius:50%;background:#fff;animation:ty 1s ease-in-out infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes ty{50%{transform:translateY(-5px);opacity:.5}}
.opt .go{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--s2);background:rgba(255,255,255,.08);transition:all .15s}
.opt.sel .go{background:rgba(0,0,0,.12);color:#0a0a0c}
.btn.alt{color:var(--tx);background:linear-gradient(145deg,#1e1e24,#0f0f13);border:1.5px solid #4a4a54;box-shadow:0 8px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)}
.btn.alt::after{opacity:.35}
.back{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px auto 0;background:none;border:0;color:var(--mut);font:700 14px system-ui,sans-serif;cursor:pointer;padding:10px}
.sch{display:flex;gap:8px;margin:2px 0 14px}
.sch input{flex:1;min-width:0;background:linear-gradient(145deg,#1e1e24,#0f0f13);border:1.5px solid #373740;border-radius:50px;color:var(--tx);padding:14px 18px;font:15px system-ui,sans-serif;outline:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.sch input::placeholder{color:#7a7a85}
.sch input:focus{border-color:#aaa;box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.sch button{flex:none;width:50px;border:0;border-radius:50%;display:grid;place-items:center;color:#0a0a0c;background:linear-gradient(145deg,#fff,#9b9ba5);cursor:pointer;box-shadow:0 6px 16px rgba(255,255,255,.18)}
.sch button:active{transform:scale(.94)}
.pr small{font:700 12px system-ui,sans-serif;color:var(--mut)}

/* ===== CELULAR 3D (DEPOIMENTO) ===== */
.ph3{perspective:1000px;width:270px;height:540px;margin:18px auto 38px;position:relative}
.ph3::after{content:"";position:absolute;left:10%;right:10%;bottom:-24px;height:20px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.4),transparent 70%);filter:blur(7px);animation:breathe 3.4s ease-in-out infinite}
.pr3{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;animation:tilt 7s ease-in-out infinite;filter:drop-shadow(0 14px 24px rgba(255,255,255,.14))}
@keyframes tilt{0%,100%{transform:rotateX(4deg) rotateY(-22deg)}50%{transform:rotateX(4deg) rotateY(22deg) translateY(-6px)}}
.pe{position:absolute;inset:0;border-radius:40px;background:linear-gradient(145deg,#d6d6dc,#6f6f79);transform:translateZ(var(--z))}
.pf,.pk{position:absolute;inset:0;border-radius:40px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#000;border:3px solid #b9b9c2;box-shadow:inset 0 0 0 5px #0b0b0e,inset 0 0 0 6px #4a4a54}
.pf{transform:translateZ(6px)}
.pk{transform:rotateY(180deg) translateZ(6px);background:linear-gradient(150deg,#1c1c22,#09090b);display:flex;flex-direction:column;align-items:center;justify-content:center}
.pf::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.13) 50%,transparent 62%);background-size:250% 100%;animation:flow 3.6s linear infinite;pointer-events:none}
.pn{position:absolute;top:12px;left:50%;width:70px;height:18px;margin-left:-35px;border-radius:12px;background:#000;box-shadow:0 0 0 1px #1d1d23;z-index:2}
.ps{position:absolute;inset:14px 14px;display:flex;flex-direction:column;font:10.5px/1.35 system-ui,sans-serif;color:#f5f5f7;text-align:left}
.ph-h{display:flex;align-items:center;gap:8px;padding:32px 4px 8px;border-bottom:1px solid #23232a}
.ph-h img{width:30px;height:30px;border-radius:50%;pointer-events:none}
.ph-h i{display:block;font:italic 15px/1.1 Georgia,serif;color:#e4e4ea}
.ph-h small{font-size:9px;color:var(--mut)}
.ph-m{margin:10px 2px 8px;padding:9px 10px;border-radius:14px;background:linear-gradient(145deg,#26262b,#141417);border:1.5px solid #9b9ba5}
.ph-v{position:relative;margin:0 2px 8px;height:80px;border-radius:14px;overflow:hidden;border:1.5px solid #9b9ba5}
.ph-v img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ph-v .pp{position:absolute;left:50%;top:50%;width:32px;height:32px;margin:-16px;border-radius:50%;background:rgba(40,40,46,.82)}
.ph-v .pp::after{content:"";position:absolute;left:12px;top:9px;border-left:10px solid #fff;border-top:7px solid transparent;border-bottom:7px solid transparent}
.ph-v b{position:absolute;right:8px;bottom:5px;font:600 8px system-ui,sans-serif;color:#ddd}
.ph-r{margin:2px 2px 0 20px;padding:9px 10px;border-radius:14px 14px 3px 14px;background:linear-gradient(145deg,#1c5a9e,#143f73);font-size:9.6px}
.ph-i{margin-top:auto;padding:9px 14px;border-radius:20px;background:#1a1a1e;color:#7a7a85;font-size:10px}

/* ===== EXEMPLOS ILUSTRATIVOS (celulares 3D + foto) — bloco adicionado ===== */
.gx-w{margin:8px 0 6px}
.gx-w .gx-tg,.gx-tb{display:inline-flex;align-items:center;gap:7px;color:var(--s2);background:linear-gradient(145deg,#24242b,#15151a);border:1px solid #3a3a43;font:800 11px system-ui,sans-serif;padding:6px 13px;border-radius:20px;letter-spacing:.9px}
.gx-row{display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:18px 10px 46px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 5%,#000 95%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 5%,#000 95%,transparent 100%)}
.gx-row::-webkit-scrollbar{display:none}
.gx-s{flex:none;width:238px;scroll-snap-align:center;display:flex;justify-content:center}
.gx-p{perspective:900px;position:relative;width:218px}
.gx-p::after{content:"";position:absolute;left:12%;right:12%;bottom:-26px;height:18px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.38),transparent 70%);filter:blur(7px);animation:breathe 3.4s ease-in-out infinite}
.gx-r{position:relative;width:100%;aspect-ratio:var(--ar);transform-style:preserve-3d;-webkit-transform-style:preserve-3d;animation:gxtilt 7s ease-in-out infinite;animation-delay:var(--d);filter:drop-shadow(0 14px 22px rgba(255,255,255,.13))}
@keyframes gxtilt{0%,100%{transform:rotateX(4deg) rotateY(-20deg)}50%{transform:rotateX(4deg) rotateY(20deg) translateY(-6px)}}
.gx-e{position:absolute;inset:0;border-radius:34px;background:linear-gradient(145deg,#d6d6dc,#6f6f79);transform:translateZ(var(--z))}
.gx-f{position:absolute;inset:0;transform:translateZ(6px);backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:34px;overflow:hidden}
.gx-f img{width:100%;height:100%;display:block;pointer-events:none}
.gx-f::after,.gx-tf::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.12) 50%,transparent 62%);background-size:250% 100%;animation:flow 3.6s linear infinite;pointer-events:none}
.gx-dots{display:flex;justify-content:center;gap:7px;margin:-18px 0 10px}
.gx-dots i{width:7px;height:7px;border-radius:50%;background:#3a3a43;transition:all .2s}
.gx-dots i.on{width:20px;border-radius:5px;background:linear-gradient(90deg,#9b9ba5,#fff)}
.gx-c{text-align:center;color:var(--mut);font:12px/1.4 system-ui,sans-serif;margin:6px 0 14px}
.gx-t{perspective:1100px;position:relative;width:min(100%,430px);margin:20px auto 40px}
.gx-t::after{content:"";position:absolute;left:10%;right:10%;bottom:-24px;height:18px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.38),transparent 70%);filter:blur(7px);animation:breathe 3.4s ease-in-out infinite}
.gx-tr{position:relative;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;animation:gxteam 8s ease-in-out infinite;filter:drop-shadow(0 16px 26px rgba(255,255,255,.13))}
@keyframes gxteam{0%,100%{transform:rotateX(3deg) rotateY(-11deg)}50%{transform:rotateX(3deg) rotateY(11deg) translateY(-6px)}}
.gx-te{position:absolute;inset:0;border-radius:24px;background:linear-gradient(145deg,#d6d6dc,#6f6f79);transform:translateZ(var(--z))}
.gx-tf{position:relative;transform:translateZ(6px);border-radius:24px;overflow:hidden;background:#000;border:1.5px solid #b9b9c2;box-shadow:inset 0 0 0 5px #0b0b0e,inset 0 0 0 6px #4a4a54}
.gx-tf img{display:block;width:100%;height:auto;pointer-events:none}
.gx-tb{position:absolute;left:14px;bottom:14px;font-size:10px;padding:5px 11px;background:rgba(10,10,12,.78)}
</style>

 <div class="card bub"><span class="av2">${ic("help",22)}</span><div><small>ASSISTENTE VIRTUAL</small><div id="m1">${typing}</div></div></div>
 ${opts(c.items,k=>"load(MENU["+i+"].items["+k+"],'cat("+i+")')")}
 <button type="button" class="back" onclick="home()">${ic("arrow",16,2.4).replace("<svg","<svg style='transform:scaleX(-1)'")}Voltar ao menu</button>${foot(chips+dots(1))}`);
 say("m1","<p>Qual é a sua dúvida?</p>")}
const nz=s=>s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const STOP=new Set("de da do das dos para por com que uma uns um as os eu meu minha como qual quais quero queria posso pode tem ter ser foi sao ao aos ou mais mas muito tambem nao sim vou fazer".split(" "));
function find(q){const w=nz(q).split(/[^a-z0-9]+/).filter(x=>x.length>2&&!STOP.has(x));if(!w.length)return null;let best=null,bs=0;
 ALL.forEach(o=>{const x=o.x,h=nz([x.t,x.a||"",(x.l||[]).join(" "),x.kw||""].join(" ")),th=nz(x.t);let s=0;
  w.forEach(k=>{const r=k.length>5?k.slice(0,-1):k;if(h.includes(r))s+=th.includes(r)?3:1});if(s>bs){bs=s;best=x}});
 return bs>=2||(w.length===1&&bs>=1)?best:null}
function ask(){const q=($("#q")||{}).value||"";if(!q.trim()||lock)return;lock=true;const r=find(q);r?load(r,"home()"):miss()}
function miss(){STEP=0;chime();
 sh(`<div style="text-align:center">${l3("sm")}<span class="tag">${ic("help",14)}DÚVIDA ESPECÍFICA</span><h1 style="margin-top:12px">Vamos te <span class="grad">ajudar</span></h1></div>
 <div class="card bub"><span class="av2">${ic("heart",22)}</span><div><small>PRIME NAILS</small><p>Essa dúvida precisa de um atendimento mais próximo. Nossa equipe responde pelo Instagram da Prime Nails.</p></div></div>
 ${igb()}<button type="button" class="back" onclick="home()">${ic("arrow",16,2.4).replace("<svg","<svg style='transform:scaleX(-1)'")}Voltar ao menu</button>${foot(dots(3))}`)}
function talk(){lock=false;miss()}

function load(x,b){CUR=x;BACK=b;STEP=0;lock=true;
 const L=["Lendo sua dúvida","Consultando a base da Prime Nails","Montando sua resposta"],TH=[34,68,100];
 sh(`<div class="card" style="text-align:center;margin-top:24px">${l3("sm")}<div class="big" id="pc">0%</div><p id="lm" style="margin:10px 0 14px">Iniciando análise…</p><div class="bar"><i id="lb"></i></div>
 <ul class="steps">${L.map((t,i)=>`<li id="s${i}"><span class="st">${ic("check",13,3.4)}</span>${t}</li>`).join("")}</ul></div>`,1);
 const t0=performance.now();let last=-1;
 const id=setInterval(()=>{const p=Math.min(100,Math.round((performance.now()-t0)/2600*100));
  $("#pc").textContent=p+"%";$("#lb").style.width=p+"%";
  TH.forEach((th,i)=>{const li=$("#s"+i);if(p>=th)li.className="ok";else if(i===0||p>=TH[i-1])li.className="run"});
  const cur=TH.findIndex(th=>p<th);if(cur>=0)$("#lm").textContent=L[cur]+"…";
  if(p!==last&&p%4===0&&p<100)blip(p);last=p;
  if(p>=100){clearInterval(id);$("#lm").textContent="Resposta pronta";$(".card").classList.add("done");chime();setTimeout(reveal,450)}},50)}

function body(x){let h=`<p style="margin:0 0 ${x.k||x.l?14:0}px;color:var(--tx)">${x.a||""}</p>`;
 if(!x.a)h="";
 if(x.l)h+=`<ul class="chk">${x.l.map(t=>`<li>${t}</li>`).join("")}</ul>`;
 if(x.k==="stats")h+=`<div class="st4"><div><b>17</b><span>MÓDULOS</span></div><div><b>9</b><span>BÔNUS</span></div><div><b>14</b><span>DIAS DE TREINO</span></div><div><b>1</b><span>CERTIFICADO</span></div></div>`;
 if(x.k==="mods"){let c=0;h+=MOD.map((m,i)=>{const it=m[1].split("|"),a=c+1;c+=it.length;return `<details><summary><span class="nb">${i+1}</span><span>${m[0]}<br><small style="color:var(--mut);font-weight:600">${it.length>1?"Módulos "+a+" a "+c:"Módulo "+c}</small></span></summary><ul class="dm">${it.map(y=>`<li>${y}</li>`).join("")}</ul></details>`}).join("")}
 if(x.k==="bon")h+=`<div class="bg">${BON.map((y,i)=>`<div><i>${i+1}</i>${y}</div>`).join("")}</div>`;
 if(x.k==="cert"){h+=cert();if(x.t==="Como é o certificado")h+=gxTeam()}
 if(x.k==="phone")h+=gxGallery();
 if(x.k==="price")h+=`<div class="card pr" style="text-align:center;margin:0"><span class="tag">${ic("star",14)}PREÇO ESPECIAL DE LANÇAMENTO</span><div style="margin-top:12px"><span class="old">De ${PRICE_OLD}</span></div><div class="big">${PRICE_NEW}</div><span class="save">ECONOMIZE ${OFF}%</span><p class="mut" style="margin:8px 0 0">Pagamento único • E-book digital • Garantia de ${DAYS} dias</p></div>`;
 return h}
function reveal(){STEP=3;lock=false;const x=CUR;chime();
 sh(`<div style="text-align:center"><span class="tag">${ic("check",14,3)}RESPOSTA</span></div>
 <div class="card" style="margin-top:14px">${hd(x.i,x.t)}<div style="height:12px"></div>${body(x)}</div>
 <button type="button" class="btn pulse" onclick="done()">${ic("check",20,2.8)}<span>Resolveu</span></button>
 ${x.ig?igb("",x.igl):""}${x.buy?buyb(1):""}
 <button type="button" class="back" onclick="${BACK}">${ic("arrow",16,2.4).replace("<svg","<svg style='transform:scaleX(-1)'")}Voltar</button>${foot(chips+dots(3))}`);
 if(x.buy){const s=document.createElement("div");s.id="stk";s.innerHTML=`<a class="btn pulse" href="${CHECKOUT_URL}">${ic("heart",20,2.2)}<span>QUERO MEU GUIA POR ${PRICE_NEW}</span>${go}</a>`;document.body.appendChild(s);
  const w=$("#buy"),f=()=>{const r=w.getBoundingClientRect();s.classList.toggle("on",scrollY>300&&!(r.top<innerHeight&&r.bottom>0))};SF=f;addEventListener("scroll",f,{passive:true});f()}}
function done(){STEP=0;chime();burst();
 sh(`<div style="text-align:center">${l3("sm")}<span class="tag">${ic("heart",14)}FICAMOS FELIZES</span><h1 style="margin-top:12px">Que bom que <span class="grad">deu certo!</span></h1></div>
 <div class="card bub"><span class="av2">${ic("heart",22)}</span><div><small>PRIME NAILS</small><p>Se precisar de mais alguma coisa, é só voltar ao menu. Foi um prazer ajudar.</p></div></div>
 <button type="button" class="btn pulse" onclick="home()">${ic("sparkle",20,2.2)}<span>Voltar ao menu</span>${go}</button>${foot(dots(3))}`)}

const cert=()=>`<div class="c3"><div class="cr">${[-2,-1,0,1,2].map(z=>`<i class="ce" style="--z:${z}px"></i>`).join("")}
<div class="cf"><div class="cw"><span class="lg" style="width:28px;height:28px"></span><b class="cn">PRIME NAILS</b></div>
<div class="ct">CERTIFICADO</div><div class="cs">DIGITAL DE CONCLUSÃO</div>
<div class="cx">Certificamos que</div><div class="cm">Nome completo da aluna</div>
<div class="cx">concluiu o curso</div><div class="cc">${COURSE}</div>
<div class="cg"><span>Carga horária</span><span>Data de conclusão</span><span>Responsável pela emissão</span></div></div>
<div class="cb"><span class="lg" style="width:92px;height:92px"></span><b class="cn" style="font-size:15px;margin-top:10px">PRIME NAILS</b><div class="cs" style="margin-top:6px">CERTIFICADO DIGITAL</div><div class="cx" style="margin-top:12px">Certificado profissional de conclusão emitido pela Prime Nails.</div></div></div></div>`;
function burst(){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 const c=document.createElement("canvas");c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20";
 const W=c.width=innerWidth,H=c.height=innerHeight,x=c.getContext("2d");document.body.appendChild(c);
 const ps=Array.from({length:70},()=>({x:W/2,y:H*.3,vx:(Math.random()-.5)*11,vy:-Math.random()*10-2,s:Math.random()*3+1.5,a:1,c:["#fff","#d6d6dc","#9b9ba5"][Math.floor(Math.random()*3)]}));
 let f=0;(function an(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.28;p.a-=.012;x.globalAlpha=Math.max(p.a,0);x.fillStyle=p.c;x.shadowColor="#fff";x.shadowBlur=8;x.fillRect(p.x,p.y,p.s,p.s*1.6)});
 if(++f<95)requestAnimationFrame(an);else c.remove()})()}
/* ===== ÁUDIO: apenas sons de clique ===== */
const AC=window.AudioContext||window.webkitAudioContext;
let ctx=null,bus=null;
function audio(){if(!AC)return null;
 if(!ctx){ctx=new AC({latencyHint:"interactive"});const cp=ctx.createDynamicsCompressor();cp.connect(ctx.destination);bus=ctx.createGain();bus.connect(cp);
  const d=ctx.createDelay(.5),fb=ctx.createGain(),wt=ctx.createGain();d.delayTime.value=.11;fb.gain.value=.28;wt.gain.value=.22;bus.connect(d);d.connect(fb);fb.connect(d);d.connect(wt);wt.connect(cp)}
 if(ctx.state==="suspended")ctx.resume();return ctx}
function tone(f,t,d,v,ty,at){const o=ctx.createOscillator(),g=ctx.createGain();o.type=ty||"sine";o.frequency.setValueAtTime(f,t);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(at||.01));g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g);g.connect(bus);o.start(t);o.stop(t+d+.05)}
function run(fn){const c=audio();if(!c)return;c.state==="running"?fn(c):c.resume().then(()=>fn(c)).catch(()=>{})}
function tick(){run(c=>{const t=c.currentTime;tone(220,t,.07,.05,"sine",.003);tone(880,t,.16,.045,"sine",.005);tone(1320,t+.008,.14,.022,"sine",.005)})}
function blip(p){run(c=>{const t=c.currentTime,n=p/4|0,sc=[0,2,4,7,9,12,14,16,19,21],f=392*Math.pow(2,sc[Math.min(Math.floor(p/10),9)]/12)*(n%2?1.5:1);tone(f,t,.22,.032,"sine",.006);tone(f*2,t+.01,.14,.01,"sine",.006)})}
function pulse(){run(c=>{const t=c.currentTime;tone(110,t,.55,.07,"sine",.03);tone(165,t+.02,.45,.03,"sine",.03)})}
function sweep(){run(c=>{const t=c.currentTime,o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.setValueAtTime(180,t);o.frequency.exponentialRampToValueAtTime(520,t+9.3);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.018,t+1);g.gain.setValueAtTime(.018,t+8.3);g.gain.exponentialRampToValueAtTime(.0001,t+9.6);o.connect(g);g.connect(bus);o.start(t);o.stop(t+9.7)})}
function chime(){run(c=>{const t=c.currentTime;[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>tone(f,t+i*.07,1.5-i*.1,.05,"sine",.01));tone(261.63,t,1.9,.06,"sine",.02);tone(2093,t+.35,1.2,.02,"sine",.01)})}
let pd=null;
addEventListener("pointerdown",e=>{const el=e.target.closest&&e.target.closest("button,a,.opt");if(!el){pd=null;return}pd={x:e.clientX,y:e.clientY,t:performance.now(),el};audio()},{passive:true});
addEventListener("pointercancel",()=>{pd=null},{passive:true});
addEventListener("pointerup",e=>{const el=e.target.closest&&e.target.closest("button,a,.opt");
 if(pd&&el===pd.el&&performance.now()-pd.t<450&&Math.hypot(e.clientX-pd.x,e.clientY-pd.y)<12){
  tick()}
 pd=null},{passive:true});
addEventListener("contextmenu",e=>{if(e.target.closest&&e.target.closest("button,a,.opt"))e.preventDefault()});
home();
</script>
